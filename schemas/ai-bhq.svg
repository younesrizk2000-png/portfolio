<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#f4f2ed"/><rect x="60" y="40" width="600" height="44" rx="22" fill="#e3ece4"/><text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5f8267" letter-spacing="2">CHAQUE TRANSACTION, AVEC SA FACTURE</text><rect x="60" y="110" width="320" height="125" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><text x="82" y="154" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2933" text-anchor="start">Application bancaire</text><text x="82" y="188" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="start">les transactions du mois</text><rect x="60" y="265" width="320" height="125" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><text x="82" y="309" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2933" text-anchor="start">E-mails</text><text x="82" y="343" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="start">factures d’abonnement</text><text x="82" y="371" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="start">envoyées automatiquement</text><rect x="60" y="420" width="320" height="125" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><text x="82" y="464" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f2933" text-anchor="start">Sites fournisseurs</text><text x="82" y="498" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="start">espace client,</text><text x="82" y="526" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="start">rubrique commandes</text><path d="M380,172 C425.0,172 425.0,300 452,300" fill="none" stroke="#5f8267" stroke-width="6"/><path d="M444,287 L470,300 L444,313 Z" fill="#5f8267"/><path d="M380,327 C425.0,327 425.0,327 452,327" fill="none" stroke="#5f8267" stroke-width="6"/><path d="M444,314 L470,327 L444,340 Z" fill="#5f8267"/><path d="M380,482 C425.0,482 425.0,355 452,355" fill="none" stroke="#5f8267" stroke-width="6"/><path d="M444,342 L470,355 L444,368 Z" fill="#5f8267"/><circle cx="600" cy="328" r="130" fill="#5f8267"/><text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text><text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Finance</text><text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff" text-anchor="middle">récupère et</text><text x="600" y="408" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff" text-anchor="middle">rattache</text><path d="M730,280 C785.0,280 785.0,190 822,190" fill="none" stroke="#5f8267" stroke-width="6"/><path d="M814,177 L840,190 L814,203 Z" fill="#5f8267"/><path d="M730,380 C785.0,380 785.0,470 822,470" fill="none" stroke="#9a6a12" stroke-width="6"/><path d="M814,457 L840,470 L814,483 Z" fill="#9a6a12"/><rect x="840" y="125" width="300" height="130" rx="18" fill="#e3ece4" stroke="#5f8267" stroke-width="3"/><text x="990" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#5f8267" text-anchor="middle">Facture rattachée</text><text x="990" y="218" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#5f8267" text-anchor="middle">à sa transaction</text><rect x="840" y="405" width="300" height="130" rx="18" fill="#f7ecd3" stroke="#9a6a12" stroke-width="3"/><text x="990" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#9a6a12" text-anchor="middle">Hors de sa portée</text><text x="990" y="498" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#9a6a12" text-anchor="middle">notification à rattacher</text><text x="600" y="610" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="middle">Fin de mois : toutes les transactions ont leur facture, avant la clôture.</text><rect x="60" y="680" width="1080" height="80" rx="40" fill="#5f8267"/><text x="600" y="733" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">L’agent récupère et rattache. Vous ne traitez que l’exception.</text></svg>