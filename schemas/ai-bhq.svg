<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#f4f2ed"/><rect x="60" y="50" width="595" height="44" rx="22" fill="#e3ece4"/><text x="80" y="80" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5f8267" text-anchor="start" letter-spacing="2">LES FACTURES DU MOIS, SANS RIEN RATER</text><rect x="60" y="170" width="230" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><circle cx="100" cy="215" r="24" fill="#5f8267"/><text x="100" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="84" y="282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start" >Import</text><text x="84" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="start" >bancaire</text><line x1="292" y1="255" x2="316" y2="255" stroke="#5f8267" stroke-width="6" stroke-linecap="round"/><path d="M308,241 L332,255 L308,269 Z" fill="#5f8267"/><rect x="335" y="170" width="230" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><circle cx="375" cy="215" r="24" fill="#5f8267"/><text x="375" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="359" y="282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start" >Paiements</text><text x="359" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="start" >↔ factures</text><line x1="567" y1="255" x2="591" y2="255" stroke="#5f8267" stroke-width="6" stroke-linecap="round"/><path d="M583,241 L607,255 L583,269 Z" fill="#5f8267"/><rect x="610" y="170" width="230" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><circle cx="650" cy="215" r="24" fill="#5f8267"/><text x="650" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="634" y="282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start" >Collecte</text><text x="634" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="start" >des factures</text><line x1="842" y1="255" x2="866" y2="255" stroke="#5f8267" stroke-width="6" stroke-linecap="round"/><path d="M858,241 L882,255 L858,269 Z" fill="#5f8267"/><rect x="885" y="170" width="230" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="3"/><circle cx="925" cy="215" r="24" fill="#5f8267"/><text x="925" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="909" y="282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start" >Rappels</text><text x="909" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="start" >au bon moment</text><path d="M600,345 L600,410" stroke="#9a6a12" stroke-width="6"/><path d="M586,400 L600,426 L614,400 Z" fill="#9a6a12"/><rect x="330" y="430" width="540" height="150" rx="18" fill="#f7ecd3" stroke="#9a6a12" stroke-width="3"/><text x="600" y="485" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#9a6a12" text-anchor="middle" >Une exception ?</text><text x="600" y="525" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#9a6a12" text-anchor="middle" >Facture manquante, montant qui ne colle pas…</text><text x="600" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9a6a12" text-anchor="middle" >L’humain valide.</text><rect x="60" y="680" width